<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZAKBlazor Enterprise Portal & Samples</title>
    <base href="/" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="_content/ZAKBlazor/css/zakblazor.css" />
    <link rel="stylesheet" href="css/samples.css" />
    <link rel="icon" type="image/png" href="images/logo.png" />
</head>

<body>
    <div id="app">
        <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: 'Inter', sans-serif; background-color: #0B0F19; color: #FFFFFF;">
            <img src="images/logo.png" alt="ZAKBlazor Logo" style="width: 72px; height: 72px; margin-bottom: 24px;" />
            <div style="font-size: 1.25rem; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 8px;">ZAKBlazor Enterprise Portal</div>
            <div style="font-size: 0.875rem; color: #94A3B8;">Loading enterprise application...</div>
        </div>
    </div>

    <div id="blazor-error-ui" style="display: none; position: fixed; bottom: 16px; right: 16px; background: #EF4444; color: #FFFFFF; padding: 12px 20px; border-radius: 8px; z-index: 99999;">
        An unhandled error has occurred.
        <a href="." class="reload" style="color: #FFFFFF; text-decoration: underline; margin-left: 8px;">Reload</a>
        <span class="dismiss" style="cursor: pointer; margin-left: 12px;">✕</span>
    </div>
    <script src="_content/ZAKBlazor/js/zakblazor.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
