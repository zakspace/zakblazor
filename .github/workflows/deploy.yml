name: Deploy Blazor to Vercel

on:
  push:
    branches:
      - main  # Adjust if your default branch is 'master'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'  # Match your .NET version

      - name: Publish Blazor App
        run: dotnet publish src/ZAKBlazor.Docs/ZAKBlazor.Docs.csproj -c Release -o release-output

      - name: Copy vercel.json into publish folder
        run: cp vercel.json release-output/wwwroot/ 2>/dev/null || true

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy Output to Vercel
        run: vercel deploy ./release-output/wwwroot --prod --yes --token=${{ secrets.VERCEL_TOKEN }} --project=${{ secrets.VERCEL_PROJECT_ID }} --scope=${{ secrets.VERCEL_ORG_ID }}
